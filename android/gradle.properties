# NOTE: this machine has ~7.7 GB RAM. The old value (-Xmx8G -XX:MaxMetaspaceSize=4G)
# made the Gradle daemon die with "There is insufficient memory for the Java Runtime
# Environment to continue" (hs_err_pid*.log) during assembleRelease.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Keep peak memory low: one worker, no parallel projects, bounded Kotlin daemon.
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

android.overridePathCheck=true

kotlin.incremental=false
