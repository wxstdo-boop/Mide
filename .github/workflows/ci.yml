name: CI

# Quality gate for pull requests and feature branches: formatting, static
# analysis, the unit/widget test suite, and a debug APK build so a broken
# Gradle/AGP/Kotlin combination fails here instead of on the release run.
# No secrets and no publishing — safe to run on every branch.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI and the release build use the exact same toolchain.
  FLUTTER_VERSION: 3.50.0

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # A debug build needs no signing config and exercises the full Android
      # toolchain (Gradle, AGP, Kotlin, native plugins) for the release ABI.
      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

  agent-sidecar:
    # The PC IDE's coding agent is a separate Node package. It is not part of
    # the Flutter build, so nothing else would notice a broken sidecar.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: node --check src/index.mjs

      # Boot the server and hit /health: proves the entrypoint, the HTTP
      # routing and the tool wiring all come up on a clean machine.
      - name: Smoke test /health
        run: |
          PROVIDER=ollama AGENT_PORT=8765 node src/index.mjs &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health > /tmp/health.json; then
              cat /tmp/health.json
              node -e 'const h=require("/tmp/health.json"); if(!h.ok) process.exit(1);'
              exit 0
            fi
            sleep 1
          done
          echo "sidecar did not answer /health" >&2
          exit 1
