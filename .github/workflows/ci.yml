name: CI

# Quality gate for pull requests and feature branches: formatting, static
# analysis, the unit/widget test suite, and a debug APK build so a broken
# Gradle/AGP/Kotlin combination fails here instead of on the release run.
# No secrets and no publishing — safe to run on every branch.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI and the release build use the exact same toolchain.
  FLUTTER_VERSION: 3.50.0

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # A debug build needs no signing config and exercises the full Android
      # toolchain (Gradle, AGP, Kotlin, native plugins) for the release ABI.
      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64
