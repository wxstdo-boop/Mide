name: Release Ship

# Auto-release pipeline: every push to main builds the release APK and
# publishes it as a GitHub Release. The version comes from pubspec.yaml
# (1.0.1+2 -> v1.0.1), so bumping the version + pushing ships a new build.
# The in-app "Проверить обновления" button picks the latest release up.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ship
  cancel-in-progress: false

env:
  # Pinned so releases use the exact toolchain that CI validates.
  FLUTTER_VERSION: 3.50.0

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from pubspec
        id: version
        run: |
          version=$(sed -n 's/^version: *\([0-9][^+]*\).*/\1/p' pubspec.yaml | head -n1)
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Shipping Mide v${version}"

      - name: Has this version already shipped?
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — release already exists
        if: steps.tag.outputs.exists == 'true'
        run: echo "v${{ steps.version.outputs.value }} уже вышла — релиз не дублируем"

      - name: Set up Java
        if: steps.tag.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        if: steps.tag.outputs.exists != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        if: steps.tag.outputs.exists != 'true'
        run: flutter pub get

      - name: Check formatting
        if: steps.tag.outputs.exists != 'true'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: steps.tag.outputs.exists != 'true'
        run: flutter analyze

      - name: Run Flutter tests
        if: steps.tag.outputs.exists != 'true'
        run: flutter test

      - name: Configure Android signing
        if: steps.tag.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "One or more Android signing repository secrets are missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mide-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mide-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        if: steps.tag.outputs.exists != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=APP_VERSION=${{ steps.version.outputs.value }}

      - name: Stage artifact
        if: steps.tag.outputs.exists != 'true'
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "mide-${{ steps.version.outputs.value }}-arm64-release.apk"
          sha256sum "mide-${{ steps.version.outputs.value }}-arm64-release.apk" \
            | tee "mide-${{ steps.version.outputs.value }}-arm64-release.apk.sha256"
          ls -lh

      - name: Create GitHub Release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Mide v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ github.token }}
          files: |
            mide-${{ steps.version.outputs.value }}-arm64-release.apk
            mide-${{ steps.version.outputs.value }}-arm64-release.apk.sha256
