name: mide
description: VPN client with API key configuration for your provider.
publish_to: 'none'
version: 1.0.1+2

environment:
  # material_ui (the standalone Material library) requires Dart >=3.13 and
  # Flutter >=3.47, so the app floor follows it.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.0
  flutter_riverpod: ^2.5.1
  dynamic_color: ^1.7.0
  dio: ^5.4.3+1
  file_picker: ^8.1.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  # Downloads dir for the GitHub auto-updater (installer save location).
  path_provider: ^2.1.4
  # Real cross-platform WireGuard tunnel (Android VpnService + Windows Wintun).
  # On the Web platform it degrades to a status indicator only.
  wireguard_flutter_pro: ^0.1.2
  cryptography: ^2.9.0
  ffmpeg_kit_flutter_new: ^4.6.8
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/mide.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/mide_fg.png"
  web:
    generate: true
    image_path: "assets/icon/mide.png"
    background_color: "#0066FF"
    theme_color: "#0066FF"
  windows:
    generate: true
    image_path: "assets/icon/mide.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/mide_square.png"
  linux:
    generate: true
    image_path: "assets/icon/mide.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/mide.png
    # Bare, pre-centred glyph (generated by .agnes/work/make_mark.py) — used by
    # the launch splash so the mark sits dead centre in its frame.
    - assets/icon/mide_mark.png